# Configuration pour production avec MySQL
# Pour utiliser : java -jar app.jar --spring.profiles.active=mysql

# Server Configuration
server.port=8080

# Application
spring.application.name=vehicules-online

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/vehicule_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=vehicule_user
spring.datasource.password=zamba-auto
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.batch_fetch_style=DYNAMIC
spring.jpa.properties.hibernate.default_batch_fetch_size=10

# CORS Configuration
spring.mvc.cors.allowed-origins=http://localhost:3000,http://localhost:5173
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true

# Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=${java.io.tmpdir}

# JWT Configuration
jwt.secret=dmVoaWN1bGVzLW9ubGluZS1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi10aGF0LXNob3VsZC1iZS1hdC1sZWFzdC0yNTYtYml0cy1sb25n
jwt.expiration=604800000
jwt.refresh-expiration=2592000000

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Bean overriding
spring.main.allow-bean-definition-overriding=true

# Upload Configuration
app.upload.allowed-extensions=jpg,jpeg,png,gif,webp
app.upload.max-file-size=10485760
app.upload.directory=./uploads
app.upload.vehicules-images=./uploads/vehicules

# Configuration pour servir les fichiers statiques
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,file:./uploads/
spring.mvc.static-path-pattern=/uploads/**

# Configuration des uploads
app.upload.directory=./uploads
app.upload.vehicule-images=./uploads/vehicule-images

# Activer la création automatique des dossiers
app.upload.auto-create-dirs=true

# Désactiver la mise en cache pour le développement
spring.resources.cache.period=0

# Logging Configuration
logging.level.com.vehicules=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.file.name=logs/vehicules-online.log
logging.file.max-size=10MB
logging.file.max-history=7
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Server Configuration
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.error.include-stacktrace=never
server.error.include-message=always

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.metrics.enabled=true
management.info.env.enabled=true